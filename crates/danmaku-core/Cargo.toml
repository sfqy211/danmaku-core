[package]
name = "danmaku-core"
version = "0.1.0"
edition = "2021"
description = "可供桌面与服务端复用的弹幕事件模型与 Bilibili 协议解析"
repository = "https://github.com/sfqy211/danmaku-core"
license-file = "../../LICENSE"

[dependencies]
base64 = "0.22"
brotli = "7"
flate2 = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
